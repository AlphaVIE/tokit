name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.98.1 fmt --all -- --check
      - name: Lint
        run: cargo +1.98.1 clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo +1.98.1 test --workspace
        env:
          TOKIT_REQUIRE_NATIVE: '1'
      - name: Research script tests
        run: python3 -m unittest discover -s tests -v

  semantic-baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify all sum-positive baselines
        run: python3 scripts/verify_sum_positive.py --require-all
