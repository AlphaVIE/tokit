name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.98.1 fmt --all -- --check
      - name: Lint
        run: cargo +1.98.1 clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo +1.98.1 test --workspace
        env:
          TOKIT_REQUIRE_NATIVE: '1'
      - name: Run Tokit example suite
        run: cargo +1.98.1 run --quiet -p tokit-compiler --bin tok -- test examples/tests.tok
      - name: Research script tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify function patch corpus
        run: python3 scripts/benchmark_function_patches.py benchmarks_version_05102026_105631 --tok target/debug/tok --verify-only --targeted-index

  semantic-baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify all sum-positive baselines
        run: python3 scripts/verify_sum_positive.py --require-all
      - name: Verify all checked-division baselines
        run: python3 scripts/verify_checked_division.py --require-all
      - name: Verify all generic-pair baselines
        run: python3 scripts/verify_generic_pair.py --require-all
      - name: Verify all line-count baselines
        run: python3 scripts/verify_line_count.py --require-all
      - name: Verify all task-square baselines
        run: python3 scripts/verify_task_square.py --require-all
      - name: Smoke-test native benchmark harness
        run: python3 scripts/bench_native.py --rust-toolchain 1.98.1 --iterations 30000 --warmups 0 --samples 1 --build-samples 1
      - name: Smoke-test array-read benchmark
        run: python3 scripts/bench_native.py --workload array-cycle --rust-toolchain 1.98.1 --iterations 30000 --warmups 0 --samples 1 --build-samples 1
      - name: Verify versioned array benchmark outputs
        run: python3 scripts/benchmark_matrix.py benchmarks_version_04102026_005141 --iterations 3000 --warmups 0 --samples 1
        env:
          RUSTUP_TOOLCHAIN: '1.98.1'
      - name: Verify pointer-chase benchmark outputs
        run: python3 scripts/benchmark_matrix.py benchmarks_version_04102026_213748 --iterations 3000 --warmups 0 --samples 1
        env:
          RUSTUP_TOOLCHAIN: '1.98.1'
      - name: Verify generated-array chase benchmark outputs
        run: python3 scripts/benchmark_matrix.py benchmarks_version_04102026_220333 --iterations 3000 --warmups 0 --samples 1
        env:
          RUSTUP_TOOLCHAIN: '1.98.1'
      - name: Verify small-array chase benchmark outputs
        run: python3 scripts/benchmark_matrix.py benchmarks_version_04102026_220333 --contract benchmarks_version_04102026_220333/contract_small.json --iterations 3000 --warmups 0 --samples 1
        env:
          RUSTUP_TOOLCHAIN: '1.98.1'
      - name: Verify alternate-stride chase benchmark outputs
        run: python3 scripts/benchmark_matrix.py benchmarks_version_04102026_220333 --contract benchmarks_version_04102026_220333/contract_large_stride13.json --iterations 3000 --warmups 0 --samples 1
        env:
          RUSTUP_TOOLCHAIN: '1.98.1'
      - name: Verify wide-integer benchmark outputs
        run: python3 scripts/benchmark_matrix.py benchmarks_version_05102026_022806 --iterations 3000 --warmups 0 --samples 1
        env:
          RUSTUP_TOOLCHAIN: '1.98.1'
      - name: Verify alternate wide-integer values
        run: python3 scripts/benchmark_matrix.py benchmarks_version_05102026_022806 --contract benchmarks_version_05102026_022806/contract_alt.json --iterations 3000 --warmups 0 --samples 1
        env:
          RUSTUP_TOOLCHAIN: '1.98.1'
