name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.98.1 fmt --all -- --check
      - name: Lint
        run: cargo +1.98.1 clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo +1.98.1 test --workspace
      - name: Research script tests
        run: python3 -m unittest discover -s tests -v
